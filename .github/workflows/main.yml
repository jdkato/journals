name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license and the attribution
      # for the paraphrased checklists travel inside it.
      - run: cp LICENSE NOTICE Journals/

      - run: zip -r Journals.zip Journals -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Journals.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v3.28.1/vale_3.28.1_Linux_64-bit.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/Std
          path: std-src

      # The Typst fixture goes through typst2vast, which Vale calls but does
      # not ship; the runners carry a Rust toolchain.
      - run: cargo install --locked typst2vast

      - run: ./test.sh
        env:
          STD: ${{ github.workspace }}/std-src/Std
