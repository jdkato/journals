# The configs the README tells you to write, one per fixture, with the
# package's styles read from the tree instead of a sync. test.sh copies this
# file beside an assembled StylesPath that has Std in it, which the acronym
# rule extends.
StylesPath = Journals/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/trial.md]
BasedOnStyles = Journals, IMRaD, PLOS, CONSORT
IMRaD.AbstractLength[max] = 300
IMRaD.AbstractCitations = error

[{fixtures,fixtures/clean}/review.qmd]
BasedOnStyles = Journals, IMRaD, PRISMA

[{fixtures,fixtures/clean}/article.Rmd]
BasedOnStyles = Journals, Nature

[{fixtures,fixtures/clean}/notebook.ipynb]
BasedOnStyles = Journals, IMRaD
View = Notebook

# A Typst title is set in code mode, which the parser skips, and its sections
# are level-one headings; the title rules stay off, as the package's own
# config has them.
[{fixtures,fixtures/clean}/trial.typ]
BasedOnStyles = Journals, IMRaD, CONSORT
CONSORT.Title = NO
