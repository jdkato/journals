# Item 9: therapeutic Intervention gives the type, administration, and any changes of treatment.
extends: occurrence
message: "Therapeutic Intervention gives the type, administration, and any changes of treatment (item 9)."
link: https://www.care-statement.org/checklist
level: error
scope: treatment
token: '(?i)\b(?:\d+ ?mg|doses?|dosage|daily|surgery|surgical|administered|treated with|therapy)\b'
min: 1

tests:
