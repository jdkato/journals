# Item 3: the abstract says what is unique about the case and its take-away lesson.
extends: occurrence
message: "The abstract says what is unique about the case and its take-away lesson (item 3)."
link: https://www.care-statement.org/checklist
level: warning
scope: abstract
token: '(?i)\b(?:unique|novel|adds|lessons?|take[- ]aways?|conclusion)\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Abstract

      Something else.
    want: |
      3:4:CARE.Abstract:The abstract says what is unique about the case and its take-away lesson (item 3).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CARE.Abstract:The abstract says what is unique about the case and its take-away lesson (item 3).
  - name: clean
    input: |
      # Title

      ## Abstract

      This case is unique in its presentation; the lesson is early imaging.
    want: ""
