# Item 5: patient Information gives de-identified demographics, main concerns, and history.
extends: occurrence
message: "Patient Information gives de-identified demographics, main concerns, and history (item 5)."
link: https://www.care-statement.org/checklist
level: error
scope: patient
token: '(?i)\b(?:year[- ]old|history|presented|symptoms?|concerns?)\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Patient Information

      Something else.
    want: |
      3:4:CARE.PatientInformation:Patient Information gives de-identified demographics, main concerns, and history (item 5).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CARE.PatientInformation:Patient Information gives de-identified demographics, main concerns, and history (item 5).
  - name: clean
    input: |
      # Title

      ## Patient Information

      A 34-year-old woman presented with a two-week history of pain.
    want: ""
