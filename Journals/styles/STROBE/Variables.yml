# Item 7: all outcomes, exposures, predictors, potential confounders, and
# effect modifiers, defined.
extends: occurrence
message: "Methods define the outcomes, exposures, predictors, and confounders (item 7)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: methods
token: '(?i)\bexposures?\b|\boutcomes?\b|confound|predictor|covariate'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:STROBE.Variables:Methods define the outcomes, exposures, predictors, and confounders (item 7).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Variables:Methods define the outcomes, exposures, predictors, and confounders (item 7).
  - name: clean
    input: |
      # Title

      ## Methods

      The outcome was death; the exposure was smoking.
    want: ""
