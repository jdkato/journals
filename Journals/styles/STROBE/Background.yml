# Item 2: the Introduction explains the scientific background and rationale.
extends: occurrence
message: "The Introduction explains the scientific background and rationale (item 2)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: introduction
token: '(?i)\b(?:background|rationale|previous studies|evidence)\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Introduction

      Something else.
    want: |
      3:4:STROBE.Background:The Introduction explains the scientific background and rationale (item 2).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Background:The Introduction explains the scientific background and rationale (item 2).
  - name: clean
    input: |
      # Title

      ## Introduction

      The rationale is the lack of cohort evidence.
    want: ""
