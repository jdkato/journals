# Item 6: eligibility criteria, and the sources and methods of selecting
# participants.
extends: occurrence
message: "Methods give the eligibility criteria and how participants were selected (item 6)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: 'doc(section:haschild(h1:contains("ethod"),h2:contains("ethod")))'
token: '(?i)eligib|inclusion criteria|exclusion criteria|were selected|selection of'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:STROBE.Eligibility:Methods give the eligibility criteria and how participants were selected (item 6).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Eligibility:Methods give the eligibility criteria and how participants were selected (item 6).
  - name: clean
    input: |
      # Title

      ## Methods

      Adults were eligible.
    want: ""
