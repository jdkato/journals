# Item 1: the study's design is indicated with a commonly used term in the
# title or abstract.
extends: occurrence
message: "Indicate the study's design with a common term in the title (item 1)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: heading.h1
token: '(?i)\bcohort\b|case-control|cross-sectional'
min: 1

tests:
  - name: fires
    input: |
      # A study of a thing

      Body.
    want: |
      1:3:STROBE.Title:Indicate the study's design with a common term in the title (item 1).
  - name: clean
    input: |
      # A cohort study of a thing

      Body.
    want: ""
