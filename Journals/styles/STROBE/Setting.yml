# Item 5: the setting, locations, and relevant dates, including recruitment,
# exposure, and follow-up.
extends: occurrence
message: "Methods describe the setting, locations, and dates (item 5)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: warning
scope: methods
token: '(?i)\bsetting\b|recruit|enrol|between \w+ \d{4} and|from \d{4} to \d{4}|follow-up'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:STROBE.Setting:Methods describe the setting, locations, and dates (item 5).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Setting:Methods describe the setting, locations, and dates (item 5).
  - name: clean
    input: |
      # Title

      ## Methods

      Participants were recruited in 2019.
    want: ""
