# Item 21: the generalizability of the study results.
extends: occurrence
message: "Discussion addresses the generalizability of the results (item 21)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: warning
scope: 'doc(section:haschild(h1:contains("Discussion"),h2:contains("Discussion")))'
token: '(?i)generali[sz]ab|external validity|apply to|applicab'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Discussion

      Something else.
    want: |
      3:4:STROBE.Generalizability:Discussion addresses the generalizability of the results (item 21).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Generalizability:Discussion addresses the generalizability of the results (item 21).
  - name: clean
    input: |
      # Title

      ## Discussion

      The results apply to adults.
    want: ""
