# Item 15: results report the numbers of outcome events or summary measures.
extends: occurrence
message: "Results report the numbers of outcome events or summary measures (item 15)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: results
token: '(?i)\b(?:outcome events|number of (?:events|cases|deaths)|person[- ]years|incidence|summary measures?)\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Results

      Something else.
    want: |
      3:4:STROBE.OutcomeData:Results report the numbers of outcome events or summary measures (item 15).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.OutcomeData:Results report the numbers of outcome events or summary measures (item 15).
  - name: clean
    input: |
      # Title

      ## Results

      There were 214 outcome events over 5,010 person-years.
    want: ""
