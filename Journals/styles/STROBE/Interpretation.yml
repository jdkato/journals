  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Interpretation:The Discussion gives a cautious overall interpretation against other evidence (item 20).
  - name: clean
    input: |
      # Title

      ## Discussion

      The findings are consistent with previous studies.
    want: ""
