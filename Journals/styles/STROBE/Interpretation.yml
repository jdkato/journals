# Item 20: the Discussion gives a cautious overall interpretation against other evidence.
extends: occurrence
message: "The Discussion gives a cautious overall interpretation against other evidence (item 20)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: error
scope: discussion
token: '(?i)\b(?:consistent with|in (?:line|keeping) with|other (?:studies|evidence)|previous studies|multiplicity|cautious)\b'
min: 1

tests:
