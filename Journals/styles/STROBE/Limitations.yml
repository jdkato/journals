# Item 19: the study's limitations, taking into account sources of bias or
# imprecision.
extends: occurrence
message: "Discussion addresses the study's limitations, including sources of bias (item 19)."
link: https://doi.org/10.1371/journal.pmed.0040296
level: warning
scope: 'doc(section:haschild(h1:contains("Discussion"),h2:contains("Discussion")))'
token: '(?i)\blimitations?\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Discussion

      Something else.
    want: |
      3:4:STROBE.Limitations:Discussion addresses the study's limitations, including sources of bias (item 19).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STROBE.Limitations:Discussion addresses the study's limitations, including sources of bias (item 19).
  - name: clean
    input: |
      # Title

      ## Discussion

      One limitation is recall.
    want: ""
