# Item 4: the Introduction states the objectives and hypotheses.
extends: occurrence
message: "The Introduction states the objectives and hypotheses (item 4)."
link: https://doi.org/10.1136/bmj.h5527
level: error
scope: introduction
token: '(?i)\b(?:objectives?|aim(?:ed|s)?|hypothes[ie]s|we (?:tested|assessed|evaluated|compared|examined|investigated|estimated|reviewed))\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Introduction

      Something else.
    want: |
      3:4:STARD.Objectives:The Introduction states the objectives and hypotheses (item 4).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:STARD.Objectives:The Introduction states the objectives and hypotheses (item 4).
  - name: clean
    input: |
      # Title

      ## Introduction

      We aimed to estimate the accuracy of the test.
    want: ""
