# The full title is at most 250 characters.
extends: existence
message: "Title runs past 250 characters."
link: https://journals.plos.org/plosone/s/submission-guidelines#loc-title
level: error
scope: heading.h1
nonword: true
raw:
  - '^.{251,}'

tests:
  - name: fires
    input: |
      # A title that keeps going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going past the limit

      Body.
    want: |
      1:3:PLOS.Title:Title runs past 250 characters.
  - name: clean
    input: |
      # A title that fits

      Body.
    want: ""
