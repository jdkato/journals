# Methods report "the threshold for significance (alpha)".
extends: occurrence
message: "Methods state the threshold for significance (alpha)."
link: https://journals.plos.org/plosone/s/submission-guidelines#loc-statistical-reporting
level: suggestion
scope: 'doc(section:haschild(h1:contains("ethod"),h2:contains("ethod")))'
token: '(?i)\balpha\b|α|significance (?:level|threshold)|(?<!\w)p\s*[<≤]\s*0?\.05'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:PLOS.Alpha:Methods state the threshold for significance (alpha).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:PLOS.Alpha:Methods state the threshold for significance (alpha).
  - name: clean
    input: |
      # Title

      ## Methods

      Alpha was 0.05.
    want: ""
