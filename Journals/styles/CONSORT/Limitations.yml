# Item 30: the trial's limitations.
extends: occurrence
message: "Discussion addresses the trial's limitations (item 30)."
link: https://doi.org/10.1371/journal.pmed.1004587
level: warning
scope: discussion
token: '(?i)\blimitations?\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Discussion

      Something else.
    want: |
      3:4:CONSORT.Limitations:Discussion addresses the trial's limitations (item 30).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CONSORT.Limitations:Discussion addresses the trial's limitations (item 30).
  - name: clean
    input: |
      # Title

      ## Discussion

      One limitation is the sample.
    want: ""
