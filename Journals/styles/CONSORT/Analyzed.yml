# Items 19 and 21: the number analyzed in each group and the analysis
# population.
extends: occurrence
message: "Results give the number analyzed in each group and the analysis population (items 19 and 21)."
link: https://doi.org/10.1371/journal.pmed.1004587
level: warning
scope: results
token: '(?i)analy[sz]ed|intention[- ]to[- ]treat|per[- ]protocol'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Results

      Something else.
    want: |
      3:4:CONSORT.Analyzed:Results give the number analyzed in each group and the analysis population (items 19 and 21).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CONSORT.Analyzed:Results give the number analyzed in each group and the analysis population (items 19 and 21).
  - name: clean
    input: |
      # Title

      ## Results

      We analyzed 40 per group.
    want: ""
