  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CONSORT.Background:The Introduction gives the scientific background and rationale (item 6).
  - name: clean
    input: |
      # Title

      ## Introduction

      The rationale is the gap in the evidence.
    want: ""
