# Item 6: the Introduction gives the scientific background and rationale.
extends: occurrence
message: "The Introduction gives the scientific background and rationale (item 6)."
link: https://doi.org/10.1371/journal.pmed.1004587
level: error
scope: introduction
token: '(?i)\b(?:background|rationale|previous (?:trials|studies)|evidence)\b'
min: 1

tests:
