    want: |
      3:4:CONSORT.Objectives:The Introduction states the objectives, for benefits and harms (item 7).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CONSORT.Objectives:The Introduction states the objectives, for benefits and harms (item 7).
  - name: clean
    input: |
      # Title

      ## Introduction

      We aimed to compare the two doses.
    want: ""
