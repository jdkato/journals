# Item 7: the Introduction states the objectives, for benefits and harms.
extends: occurrence
message: "The Introduction states the objectives, for benefits and harms (item 7)."
link: https://doi.org/10.1371/journal.pmed.1004587
level: error
scope: introduction
token: '(?i)\b(?:objectives?|aim(?:ed|s)?|hypothes[ie]s|we (?:tested|assessed|evaluated|compared|examined|investigated|estimated|reviewed))\b'
min: 1

tests:
