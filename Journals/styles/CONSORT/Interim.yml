# Item 16b: methods explain interim analyses and stopping guidelines, or that there were none.
extends: occurrence
message: "Methods explain interim analyses and stopping guidelines, or that there were none (item 16b)."
link: https://doi.org/10.1371/journal.pmed.1004587
level: warning
scope: methods
token: '(?i)\b(?:interim analys[ie]s|stopping (?:rules?|guidelines?|boundar(?:y|ies))|no interim)\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:CONSORT.Interim:Methods explain interim analyses and stopping guidelines, or that there were none (item 16b).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:CONSORT.Interim:Methods explain interim analyses and stopping guidelines, or that there were none (item 16b).
  - name: clean
    input: |
      # Title

      ## Methods

      No interim analyses were planned.
    want: ""
