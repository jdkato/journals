# Item 16b: studies that looked eligible but were excluded, and why.
extends: occurrence
message: "Results cite the studies that looked eligible but were excluded, and say why (item 16b)."
link: https://doi.org/10.1136/bmj.n71
level: warning
scope: results
token: '(?i)\bexcluded\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Results

      Something else.
    want: |
      3:4:PRISMA.Excluded:Results cite the studies that looked eligible but were excluded, and say why (item 16b).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:PRISMA.Excluded:Results cite the studies that looked eligible but were excluded, and say why (item 16b).
  - name: clean
    input: |
      # Title

      ## Results

      Three were excluded for design.
    want: ""
