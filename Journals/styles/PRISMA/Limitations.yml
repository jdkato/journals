# Items 23b and 23c: limitations of the evidence and of the review process.
extends: occurrence
message: "Discussion addresses the limitations of the evidence and of the review process (items 23b and 23c)."
link: https://doi.org/10.1136/bmj.n71
level: warning
scope: discussion
token: '(?i)\blimitations?\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Discussion

      Something else.
    want: |
      3:4:PRISMA.Limitations:Discussion addresses the limitations of the evidence and of the review process (items 23b and 23c).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:PRISMA.Limitations:Discussion addresses the limitations of the evidence and of the review process (items 23b and 23c).
  - name: clean
    input: |
      # Title

      ## Discussion

      One limitation is the search.
    want: ""
