# Item 6: every database, register, and other source searched, with the date
# last searched.
extends: occurrence
message: "Methods name the sources searched and the date last searched (item 6)."
link: https://doi.org/10.1136/bmj.n71
level: error
scope: 'doc(section:haschild(h1:contains("ethod"),h2:contains("ethod")))'
token: '(?i)MEDLINE|PubMed|Embase|Scopus|Web of Science|CINAHL|PsycINFO|Cochrane|CENTRAL|Google Scholar|\bdatabases?\b|\bregisters?\b'
min: 1

tests:
  - name: fires
    about: "the section is there and says nothing about it"
    input: |
      # Title

      ## Methods

      Something else.
    want: |
      3:4:PRISMA.InformationSources:Methods name the sources searched and the date last searched (item 6).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:PRISMA.InformationSources:Methods name the sources searched and the date last searched (item 6).
  - name: clean
    input: |
      # Title

      ## Methods

      We searched MEDLINE and Embase.
    want: ""
