# Item 23a: the Discussion gives a general interpretation of the results in the context of other evidence.
extends: occurrence
message: "The Discussion gives a general interpretation of the results in the context of other evidence (item 23a)."
link: https://doi.org/10.1136/bmj.n71
level: error
scope: discussion
token: '(?i)\b(?:in the context of|consistent with|in (?:line|keeping) with|other (?:reviews|evidence)|previous reviews)\b'
min: 1

tests:
