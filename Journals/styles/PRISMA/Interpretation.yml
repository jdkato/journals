      ## Discussion

      Something else.
    want: |
      3:4:PRISMA.Interpretation:The Discussion gives a general interpretation of the results in the context of other evidence (item 23a).
  - name: absent
    about: "no section at all"
    input: |
      # Title

      Body.
    want: |
      1:1:PRISMA.Interpretation:The Discussion gives a general interpretation of the results in the context of other evidence (item 23a).
  - name: clean
    input: |
      # Title

      ## Discussion

      The results are consistent with previous reviews.
    want: ""
