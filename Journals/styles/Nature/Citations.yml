# "When cited in the text, reference numbers are superscript, not in
# brackets." In Markdown, a superscript is ^1^.
extends: existence
message: "Nature sets reference numbers as superscripts, not in brackets: '%s'."
link: https://www.nature.com/nature/for-authors/formatting-guide
level: warning
scope: ~references
nonword: true
raw:
  - '\[\d+(?:[,–-]\s?\d+)*\]'

tests:
  - name: fires
    input: |
      # Title

      A claim [1] and another [2,3].

      ## References

      1. A. 2001.
    want: |
      3:9:Nature.Citations:Nature sets reference numbers as superscripts, not in brackets: '[1]'.
      3:25:Nature.Citations:Nature sets reference numbers as superscripts, not in brackets: '[2,3]'.
  - name: clean
    input: |
      # Title

      A claim^1^ and another^2,3^.
    want: ""
