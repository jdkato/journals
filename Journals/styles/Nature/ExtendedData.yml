# Online-only display items are cited as "Extended Data Fig. 1 and Extended
# Data Table 1", and "Supplementary Information should not contain figures".
extends: substitution
message: "Cite an online-only figure as '%s', not '%s'."
link: https://www.nature.com/nature/for-authors/formatting-guide
level: warning
nonword: true
swap:
  '\bExtended Data Fig(?:ure)? (?=\d)': 'Extended Data Fig. '
  '\bSupplementary Fig(?:ure|\.)?\s?(?=S?\d)': 'Extended Data Fig. '

tests:
  - name: fires
    input: |
      See Extended Data Figure 1 and Supplementary Fig. S2.
    want: |
      1:5:Nature.ExtendedData:Cite an online-only figure as 'Extended Data Fig. ', not 'Extended Data Figure '.
      1:32:Nature.ExtendedData:Cite an online-only figure as 'Extended Data Fig. ', not 'Supplementary Fig. '.
  - name: clean
    input: |
      See Extended Data Fig. 1 and Extended Data Table 1.
    want: ""
