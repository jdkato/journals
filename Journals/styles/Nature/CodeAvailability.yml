# "Please provide separate Data Availability and Code Availability
# statements after the main text."
extends: occurrence
message: "A Code Availability statement."
link: https://www.nature.com/nature/for-authors/formatting-guide
level: warning
scope: raw
token: '(?i)\bcode availability\b'
min: 1

tests:
  - name: fires
    input: |
      # Title

      Body.
    want: |
      1:1:Nature.CodeAvailability:A Code Availability statement.
  - name: clean
    input: |
      # Title

      ## Code availability

      On GitHub.
    want: ""
