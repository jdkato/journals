# The core is on by default: the conventions every journal shares. Name a
# journal or a reporting guideline beside it in your own config:
#
#   [*.{md,qmd,Rmd}]
#   BasedOnStyles = Journals, IMRaD, PLOS, CONSORT
#
# Std is the standard library the acronym rule extends; sync pulls it in,
# and it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[*.{md,qmd,Rmd,myst}]
BasedOnStyles = Journals

# The View reads a notebook's Markdown cells as one manuscript.
[*.ipynb]
BasedOnStyles = Journals
View = Notebook

# A Typst title is set in code mode, which the parser skips, and its sections
# are level-one headings. The rules that read a title or the paragraph after
# it would read the first section instead, so they stay off.
[*.typ]
BasedOnStyles = Journals
Nature.Title = NO
Nature.TitleContent = NO
Nature.Summary = NO
Nature.SummaryContent = NO
Nature.HereWeShow = NO
PLOS.Title = NO
PLOS.TitleCase = NO
PLOS.TitleAbbreviations = NO
CONSORT.Title = NO
PRISMA.Title = NO
